[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tangrowth"
dynamic = ["version"]
description = "A small, polite async website crawler and broken-link checker built on asyncio and aiohttp."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Mehmet Kose" }]
keywords = ["crawler", "spider", "asyncio", "aiohttp", "broken-links", "link-checker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = ["aiohttp>=3.11"]

[project.urls]
Homepage = "https://github.com/mehmetkose/tangrowth"
Issues = "https://github.com/mehmetkose/tangrowth/issues"

[project.scripts]
tangrowth = "tangrowth.cli:main"

[dependency-groups]
dev = ["pytest>=8.4", "pytest-asyncio>=1.0", "pytest-aiohttp>=1.1", "ruff>=0.15"]

[tool.hatch.version]
path = "src/tangrowth/_version.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# An unclosed aiohttp session or a leaked task should fail the test, not just warn.
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
exclude = ["*.md"]  # keep the hand-aligned code samples in README.md

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
